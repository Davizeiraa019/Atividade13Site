<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Bem-vindo à TechStore Brasil</h1>
        <h2>Acesse sua conta e fique por dentro das melhores ofertas em tecnologia.</h2>
    </header>
    <main>
        <section>
            <img src="../img/login.png" alt="Imagem para o login" width="600" height="400">
        </section>
        <form action="../index.html">
            <label>E-mail</label>
            <input type="email" 
            placeholder="Digite seu e-mail">


            <label>Senha</label>
            <input type="password" placeholder="Digite a senha">


            <button type="submit">Entrar</button>

        </form>
    </main>
    <footer>
        <p>
            <a href="../index.html">Clique para retornar a página principal</a>
        </p>
        <p>
            <a href="../paginaDeCadastro/index.html">Não tem cadastro? Cadastre-se</a></a>
        </p>
        <p>
            <a href="../paginaDeRecuperacaoDeSenha/index.html">Esqueceu a senha? Clique para redefinir</a>
        </p>
        <p>&copy; 2026 TechStore Brasil. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
